# yaml-language-server: $schema=none
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-app
  title: Python app template
  description: Create and register a new Python service
spec:
  owner: development
  type: service

  parameters:
    - title: Component details
      required:
        - component_id
        - owner
        - environment
      properties:
        component_id:
          title: Component name
          type: string
          description: A lowercase, URL-safe name for the service
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 63
        owner:
          title: Owner
          type: string
          description: The Backstage owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
                - User
        environment:
          title: Environment
          type: string
          description: The environment where this component will be deployed
          default: dev
          enum:
            - dev
            - staging
            - prod

    - title: Repository details
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetchBase
      name: Fetch base
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          owner: ${{ parameters.owner }}
          environment: ${{ parameters.environment }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        description: Python service ${{ parameters.component_id }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
