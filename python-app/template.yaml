# yaml-language-server: $schema=none
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: python-app
  title: Python Application
  description: Creates and publishes a Python application to GitHub

spec:
  owner: user:default/guest
  type: service

  parameters:
    - title: Application details
      required:
        - app_name
        - app_env
      properties:
        app_name:
          title: Application Name
          type: string
          description: Name of the new application
          ui:field: EntityNamePicker
          ui:autofocus: true

        app_env:
          title: Environment
          type: string
          description: Deployment environment
          default: dev
          enum:
            - dev
            - staging
            - production
          enumNames:
            - Development
            - Staging
            - Production

    - title: Repository details
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: GitHub owner and repository name
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          app_name: ${{ parameters.app_name }}
          app_env: ${{ parameters.app_env }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: Python application ${{ parameters.app_name }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Register in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Open GitHub Repository
        url: ${{ steps['publish'].output.remoteUrl }}

      - title: Open in Backstage Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
